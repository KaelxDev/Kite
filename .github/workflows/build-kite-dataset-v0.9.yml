name: Build Kite Dataset v0.9

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_kite_dataset_v0.9.py"
      - "scripts/prepare_dataset.py"
      - "datasets/raw/kite_behavior_core_v1.0.jsonl"
      - "datasets/raw/kite_conversations_v0.6-curated.jsonl"
      - "datasets/raw/kite_conversations_multiturn_v0.1.jsonl"
      - ".github/workflows/build-kite-dataset-v0.9.yml"

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate hybrid v0.9
        run: python scripts/generate_kite_dataset_v0.9.py

      - name: Prepare training dataset
        run: python scripts/prepare_dataset.py

      - name: Validate raw and processed JSONL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path("datasets/raw/kite_conversations_v0.9-hybrid.jsonl")
          train = Path("datasets/processed/train.jsonl")

          raw_rows = [json.loads(x) for x in raw.read_text(encoding="utf-8").splitlines() if x.strip()]
          train_rows = [json.loads(x) for x in train.read_text(encoding="utf-8").splitlines() if x.strip()]

          assert len(raw_rows) >= 500, f"Apenas {len(raw_rows)} exemplos no raw"
          assert len(train_rows) >= 300, f"Apenas {len(train_rows)} exemplos após limpeza"
          assert all(isinstance(r.get("messages"), list) for r in train_rows)
          assert all(r["messages"][-1]["role"] == "assistant" for r in train_rows)
          assert all(set(m["role"] for m in r["messages"]) <= {"system", "user", "assistant"} for r in train_rows)
          multi = sum(len(r["messages"]) > 2 for r in train_rows)
          assert multi >= 20, f"Poucas conversas multivoltas: {multi}"

          print(f"OK: raw={len(raw_rows)} | train={len(train_rows)} | multiturn={multi}")
          PY

      - name: Commit datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/raw/kite_conversations_v0.9-hybrid.jsonl datasets/processed/train.jsonl
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos datasets."
            exit 0
          fi
          git commit -m "build(dataset): refresh Kite v0.9 hybrid training set [skip ci]"
          git push
